<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>og-image</title>
<!-- مصدر صورة المعاينة og-image.png (1200×627). أعد توليدها بالأمر الموجود في README. -->
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 627px; overflow: hidden;
    background: radial-gradient(circle at 85% 10%, #2a1a10 0%, #0f131a 55%);
    color: #e6e9ef;
    font-family: "Segoe UI", "Noto Sans Arabic", Tahoma, sans-serif;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 80px; box-sizing: border-box;
  }
  h1 { font-size: 92px; margin: 0; line-height: 1.1; }
  h1 .accent { color: #ff7a2f; }
  h1 .logo { font-family: Consolas, monospace; color: #ff7a2f; font-size: 64px; direction: ltr; display: inline-block; }
  .sub { font-size: 30px; color: #9aa3b4; margin: 14px 0 44px; }
  .ask {
    background: #181e29; border: 2px solid #ff7a2f; border-radius: 18px;
    font-size: 30px; padding: 20px 28px; width: fit-content; max-width: 100%;
  }
  .arrow { font-size: 30px; color: #9aa3b4; margin: 14px 28px; }
  .result { display: flex; gap: 18px; align-items: center; }
  code {
    font-family: "Cascadia Code", Consolas, monospace; direction: ltr;
    background: #0a0d13; color: #e8edf5; border: 1px solid #2a3242;
    font-size: 36px; padding: 16px 26px; border-radius: 14px;
  }
  .badge { font-size: 26px; font-weight: 700; padding: 6px 20px; border-radius: 999px; }
  .warn { background: #2c2412; color: #f2b84b; }
  .note { font-size: 24px; color: #9aa3b4; margin-top: 30px; }
</style>
</head>
<body>
  <h1><span class="logo">&lt;/&gt;</span> Git <span class="accent">بالعربية</span></h1>
  <div class="sub">اكتب ما تريد بالفصحى أو العامية… واحصل على الأمر الصحيح</div>
  <div class="ask">«لا تحذف تعديلاتي بس الغي آخر كوميت»</div>
  <div class="arrow">↓</div>
  <div class="result"><code>git reset --soft HEAD~1</code><span class="badge warn">تحذير</span></div>
  <div class="note">32 أمراً · شرح عربي · تحذير واضح للأوامر الخطرة · بلا أي مكتبات</div>
</body>
</html>
